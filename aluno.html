<!-- LOGS DE ACESSO / LISTENER EM TEMPO REAL -- Aluno — responsável: Isaque -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acesso do Aluno</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Acesso do Aluno (Catraca)</h1>
    <nav><a href="index.html">← Voltar</a></nav>
  </header>

  <main>

    <div class="card">
      <h2>Simular reconhecimento</h2>

      <label for="matricula">Matrícula do aluno</label>

      <input
        type="text"
        id="matricula"
        placeholder="Ex: 2024001"
      />

      <button id="btn-verificar">
        Verificar acesso
      </button>
    </div>

    <div class="card" id="resultado" style="display:none;">
      <h2>Resultado</h2>

      <p id="texto-resultado"></p>

      <div id="dados-turma" style="display:none;">
        <h3>Informações da turma</h3>

        <p>Disciplina: <strong id="disciplina"></strong></p>
        <p>Sala: <strong id="sala"></strong></p>
        <p>Módulo: <strong id="modulo"></strong></p>
        <p>Andar: <strong id="andar"></strong></p>
      </div>
    </div>

  </main>

  <script type="module">
    import { verificarAcesso } from "./js/auth.js";
import { escutarTurma } from "./js/logs.js";

let pararEscuta = null;

document.getElementById("btn-verificar").addEventListener("click", async () => {

  const matricula = document.getElementById("matricula").value.trim();

  if (!matricula) return;

  // Encerra uma escuta anterior
  if (pararEscuta) {
    pararEscuta();
    pararEscuta = null;
  }

  const resultadoDiv = document.getElementById("resultado");
  const texto = document.getElementById("texto-resultado");
  const dadosTurma = document.getElementById("dados-turma");

  resultadoDiv.style.display = "block";
  dadosTurma.style.display = "none";
  texto.textContent = "Verificando acesso...";

  try {
    const resposta = await verificarAcesso(matricula);

    if (!resposta.autorizado) {
      texto.textContent = `Acesso negado: ${resposta.motivo}`;
      return;
    }

    texto.textContent = "Acesso liberado! Aguardando informações da turma...";

    const turmaId = resposta.turma?.id ?? resposta.turmaId;

    if (!turmaId) {
      texto.textContent = "Acesso liberado, mas nenhuma turma foi vinculada ao aluno.";
      return;
    }

    pararEscuta = escutarTurma(turmaId, (turma) => {

      if (!turma) {
        texto.textContent = "Turma não encontrada.";
        dadosTurma.style.display = "none";
        return;
      }

      texto.textContent = "Acesso liberado! Informações atualizadas.";

      document.getElementById("disciplina").textContent =
        turma.disciplina ?? "Não informado";

      document.getElementById("sala").textContent =
        turma.sala ?? "Não informado";

      document.getElementById("modulo").textContent =
        turma.modulo ?? "Não informado";

      document.getElementById("andar").textContent =
        turma.andar ?? "Não informado";

      dadosTurma.style.display = "block";
    });

  } catch (erro) {
    console.error(erro);
    texto.textContent = "Erro ao verificar acesso. Tente novamente.";
  }
});

  </script>
</body>
</html>
