<!-- LOGS DE ACESSO / LISTENER EM TEMPO REAL -- Aluno — responsável: Isaque -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acesso do Aluno</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
<script src="js/guard.js" data-papeis="admin,professor"></script>
</head>
<body>
  <header>
    <h1>Acesso do Aluno (Catraca)</h1>
    <nav><a href="index.html">← Voltar</a></nav>
  </header>

  <main>

    <div class="card">
      <h2>Simular reconhecimento</h2>

      <label for="matricula">Matrícula do aluno</label>

      <input
        type="text"
        id="matricula"
        placeholder="Ex: 2024001"
      />

      <button id="btn-verificar">
        Verificar acesso
      </button>

      <hr style="margin:16px 0;opacity:.2;" />
      <h3>Login facial (face-api.js)</h3>
      <video id="video-catraca" autoplay playsinline muted style="width:100%;max-width:320px;border-radius:12px;background:#111;display:block;margin:8px 0;"></video>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <button type="button" id="btn-camera-catraca">Iniciar câmera</button>
        <button type="button" id="btn-facial-catraca">Reconhecer e verificar</button>
      </div>
      <p id="status-facial-catraca">Use a câmera para reconhecer um aluno com facial cadastrada.</p>
    </div>

    <div class="card" id="resultado" style="display:none;">
      <h2>Resultado</h2>

      <p id="texto-resultado"></p>

      <div id="dados-turma" style="display:none;">
        <h3>Informações da turma</h3>

        <p>Disciplina: <strong id="disciplina"></strong></p>
        <p>Sala: <strong id="sala"></strong></p>
        <p>Módulo: <strong id="modulo"></strong></p>
        <p>Andar: <strong id="andar"></strong></p>
      </div>
    </div>

  </main>

  <script type="module">
    import { verificarAcesso } from "./js/auth.js";
    import { escutarTurma } from "./js/logs.js";
    import { carregarModelos, iniciarCamera, pararCamera, identificarAlunoPorFace } from "./js/facial-recognition.js";

    let pararEscuta = null;
    const videoCatraca = document.getElementById("video-catraca");
    const statusFacial = document.getElementById("status-facial-catraca");

    async function processarMatricula(matricula) {
      if (!matricula) return;

      if (pararEscuta) {
        pararEscuta();
        pararEscuta = null;
      }

      const resultadoDiv = document.getElementById("resultado");
      const texto = document.getElementById("texto-resultado");
      const dadosTurma = document.getElementById("dados-turma");

      resultadoDiv.style.display = "block";
      dadosTurma.style.display = "none";
      texto.textContent = "Verificando acesso...";

      try {
        const resposta = await verificarAcesso(matricula);

        if (!resposta.autorizado) {
          texto.textContent = `Acesso negado: ${resposta.motivo}`;
          return;
        }

        texto.textContent = "Acesso liberado! Aguardando informações da turma...";

        const turmaId = resposta.turma?.id ?? resposta.turmaId;

        if (!turmaId) {
          texto.textContent = "Acesso liberado, mas nenhuma turma foi vinculada ao aluno.";
          return;
        }

        pararEscuta = escutarTurma(turmaId, (turma) => {
          if (!turma) {
            texto.textContent = "Turma não encontrada.";
            dadosTurma.style.display = "none";
            return;
          }

          texto.textContent = "Acesso liberado! Informações atualizadas.";

          document.getElementById("disciplina").textContent = turma.disciplina ?? "Não informado";
          document.getElementById("sala").textContent = turma.sala ?? "Não informado";
          document.getElementById("modulo").textContent = turma.modulo ?? "Não informado";
          document.getElementById("andar").textContent = turma.andar ?? "Não informado";

          dadosTurma.style.display = "block";
        });
      } catch (erro) {
        console.error(erro);
        texto.textContent = "Erro ao verificar acesso. Tente novamente.";
      }
    }

    document.getElementById("btn-verificar").addEventListener("click", async () => {
      const matricula = document.getElementById("matricula").value.trim();
      if (!matricula) return;
      await processarMatricula(matricula);
    });

    document.getElementById("btn-camera-catraca").addEventListener("click", async () => {
      try {
        statusFacial.textContent = "Carregando modelos e iniciando câmera...";
        await carregarModelos();
        await iniciarCamera(videoCatraca);
        statusFacial.textContent = "Câmera ativa. Clique em “Reconhecer e verificar”.";
      } catch (erro) {
        console.error(erro);
        statusFacial.textContent = "Erro ao iniciar câmera/modelos: " + erro.message;
      }
    });

    document.getElementById("btn-facial-catraca").addEventListener("click", async () => {
      try {
        statusFacial.textContent = "Reconhecendo rosto...";
        const resultado = await identificarAlunoPorFace(videoCatraca);
        if (!resultado.encontrado) {
          statusFacial.textContent = resultado.motivo || "Rosto não reconhecido.";
          return;
        }
        const aluno = resultado.aluno || {};
        const matricula = String(aluno.matricula || "").trim();
        if (!matricula) {
          statusFacial.textContent = "Aluno reconhecido sem matrícula cadastrada.";
          return;
        }
        document.getElementById("matricula").value = matricula;
        statusFacial.textContent = `Reconhecido: ${aluno.nome || "Aluno"} (matrícula ${matricula}). Verificando acesso...`;
        await processarMatricula(matricula);
      } catch (erro) {
        console.error(erro);
        statusFacial.textContent = "Erro no reconhecimento facial: " + erro.message;
      }
    });

    window.addEventListener("beforeunload", () => pararCamera(videoCatraca));
  </script>
</body>
</html>
