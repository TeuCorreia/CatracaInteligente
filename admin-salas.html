<!-- SALAS - Admin-salas — responsável: Murilo -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadastro de Salas</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Cadastro de Salas</h1>
    <nav><a href="index.html">← Voltar</a></nav>
  </header>

  <main>

    <div class="card">
      <h2>Nova sala</h2>
      <form id="form-sala">
        <label>Número da sala</label>
        <input type="text" id="numero" required pattern="[0-9]+" inputmode="numeric" title="Digite apenas números."/>

        <label>Módulo</label>
        <input type="text" id="modulo" required/>

        <label>Andar</label>
        <input type="number" id="andar" required pattern="[0-9]+" inputmode="numeric" title="Digite apenas números."/>

        <label>Capacidade</label>
        <input type="number" id="capacidade" required pattern="[0-9]+" inputmode="numeric" title="Digte apenas números."/>

        <button type="submit">Cadastrar sala</button>
      </form>
    </div>

    <div class="card">
      <h2>Salas cadastradas</h2>
      <div id="lista-salas">Carregando...</div>
    </div>
  </main>

  <script type="module">
    import { criarSala, escutarSalas, removerSala, atualizarSala } from "./js/salas.js";
    let salaEmEdicao = null;

    document.getElementById("form-sala").addEventListener("submit", async (e) => {
      e.preventDefault();
      await criarSala({
        numero: document.getElementById("numero").value,
        modulo: document.getElementById("modulo").value,
        andar: document.getElementById("andar").value,
        capacidade: document.getElementById("capacidade").value,
      });
      e.target.reset();
    });

    escutarSalas((salas) => {
      const container = document.getElementById("lista-salas");
      if (salas.length === 0) {
        container.innerHTML = "<p>Nenhuma sala cadastrada ainda.</p>";
        return;
      }
      container.innerHTML = salas
        .map(
          (s) => `
        <div class="lista-item">
          <span>Sala ${s.numero} — Módulo ${s.modulo}, ${s.andar}º andar (cap. ${s.capacidade})</span>
          <button data-id="${s.id}" class="btn-editar">Editar</button>
          <button data-id="${s.id}" class="btn-remover">Remover</button>
        </div>`
        )
        .join("");
        //botão editar
        container.querySelectorAll(".btn-editar").forEach((btn) => {
          btn.addEventListener("click", () => {
            const sala = salas.find((s) => s.id === btn.dataset.id);

            if (!sala) return;

            salaEmEdicao = sala.id;

            document.getElementById("form-sala")
              .closest(".card")
              .querySelector("h2")
              .textContent = "Editando Sala";

            document.getElementById("numero").value = sala.numero;
            document.getElementById("modulo").value = sala.modulo;
            document.getElementById("andar").value = sala.andar;
            document.getElementById("capacidade").value = sala.capacidade;

            document.querySelector('#form-sala button[type="submit"]').textContent =
              "Salvar alterações";

            document.getElementById("numero").focus();
          });
        });

      //botão remover
      container.querySelectorAll(".btn-remover").forEach((btn) => {
        btn.addEventListener("click", () => removerSala(btn.dataset.id));
      });
    });

    document.getElementById("form-sala").addEventListener(
      "submit",
      async (e) => {
      // Fora da edição, mantém o cadastro original.
      if (salaEmEdicao === null) return;

      e.preventDefault();
      e.stopImmediatePropagation();

      const formulario = e.target;
      const botao = formulario.querySelector('button[type="submit"]');

      if (botao.disabled) return;

      const dadosNovos = {
        numero: document.getElementById("numero").value.trim(),
        modulo: document.getElementById("modulo").value.trim(),
        andar: Number(document.getElementById("andar").value),
        capacidade: Number(document.getElementById("capacidade").value),
      };

      botao.disabled = true;

      try {
        await atualizarSala(salaEmEdicao, dadosNovos);

        document.getElementById("form-sala")
          .closest(".card")
          .querySelector("h2")
          .textContent = "Nova sala";

        salaEmEdicao = null;
        formulario.reset();
        botao.textContent = "Cadastrar sala";

        alert("Sala atualizada!");
      } catch (erro) {
        alert(erro.message);
      } finally {
        botao.disabled = false;
      }
    },
    { capture: true }
  );
  </script>
</body>
</html>
