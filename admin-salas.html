<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadastro de Salas</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin-salas.css" />
<script src="js/theme.js"></script>
<script src="js/guard.js" data-papeis="admin"></script>
</head>
<body>
  <header>
    <h1>Cadastro de Salas</h1>
    <nav><a href="index.html">← Voltar</a> <a href="planta3d.html">Ver no prédio 3D</a></nav>
  </header>

  <main>
    <div class="resumo">
      <div><b id="r-salas">0</b><span>salas</span></div>
      <div><b id="r-andares">0</b><span>andares</span></div>
      <div><b id="r-prox">—</b><span>próxima sala</span></div>
    </div>

    <div class="aviso" id="aviso" hidden></div>

    <div class="card">
      <h2 id="titulo-form">Nova sala</h2>
      <p class="dica">
        Informe só a capacidade. O número, o andar e o módulo são definidos automaticamente
        e o prédio cresce conforme as salas são cadastradas.
      </p>
      <form id="form-sala">
        <label for="capacidade">Capacidade (lugares)</label>
        <input type="number" id="capacidade" required min="1" step="1" inputmode="numeric" placeholder="Ex: 40" />

        <div class="previa" id="previa"></div>

        <button type="submit" id="btn-salvar">Cadastrar sala</button>
        <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
      </form>
    </div>

    <div class="card">
      <h2>Salas cadastradas</h2>
      <div id="lista-salas">Carregando...</div>
    </div>
  </main>

  <script type="module" src="js/admin-salas.js"></script>
</body>
</html>
