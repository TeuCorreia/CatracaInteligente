<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Professores</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/theme.js"></script>
<script src="js/guard.js" data-papeis="admin"></script>
</head>
<body>
  <header>
    <h1>Cadastro de Professores</h1>
    <nav><a href="index.html">← Voltar</a></nav>
  </header>

  <main>
    <div class="card">
      <h2 id="titulo-form">Novo professor</h2>
      <form id="form-professor">
        <label>Nome</label>
        <input type="text" id="prof-nome" required />

        <label>E-mail</label>
        <input type="email" id="prof-email" required />

        <label>Cadastro facial (face-api.js)</label>
        <video id="video-prof" autoplay playsinline muted style="width:100%;max-width:320px;border-radius:12px;background:#111;display:block;margin:8px 0;"></video>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <button type="button" id="btn-camera-prof">Iniciar câmera</button>
          <button type="button" id="btn-capturar-prof">Capturar rosto</button>
          <button type="button" id="btn-limpar-face-prof">Remover facial</button>
        </div>
        <p id="status-face-prof">Nenhuma facial capturada (opcional, para identificação facial).</p>

        <button type="submit" id="btn-submit">Cadastrar professor</button>
        <button type="button" id="btn-cancelar" style="display:none;">Cancelar edição</button>
      </form>
    </div>

    <div class="card">
      <h2>Professores cadastrados</h2>
      <div id="lista-professores">Carregando...</div>
    </div>
  </main>

  <script type="module">
    import { criarProfessor, escutarProfessores, atualizarProfessor, removerProfessor } from "./js/professores.js";
    import { carregarModelos, iniciarCamera, pararCamera, capturarDescritor, temDescritor } from "./js/facial-recognition.js";

    let profEmEdicao = null;
    let descritorCapturado = null;
    let descritorExistente = null;
    const video = document.getElementById("video-prof");
    const statusFace = document.getElementById("status-face-prof");

    function atualizarStatusFace() {
      if (descritorCapturado) statusFace.textContent = "Facial capturada e pronta para salvar.";
      else if (descritorExistente) statusFace.textContent = "Facial já cadastrada (será mantida se você não capturar outra).";
      else statusFace.textContent = "Nenhuma facial capturada (opcional, para identificação facial).";
    }

    function limparEdicao() {
      profEmEdicao = null;
      descritorCapturado = null;
      descritorExistente = null;
      pararCamera(video);
      document.getElementById("form-professor").reset();
      document.getElementById("titulo-form").textContent = "Novo professor";
      document.getElementById("btn-submit").textContent = "Cadastrar professor";
      document.getElementById("btn-cancelar").style.display = "none";
      atualizarStatusFace();
    }

    document.getElementById("btn-cancelar").addEventListener("click", limparEdicao);

    document.getElementById("btn-camera-prof").addEventListener("click", async () => {
      try {
        statusFace.textContent = "Carregando modelos e iniciando câmera...";
        await carregarModelos();
        await iniciarCamera(video);
        statusFace.textContent = "Câmera ativa. Posicione o rosto e clique em “Capturar rosto”.";
      } catch (erro) {
        console.error(erro);
        statusFace.textContent = "Erro ao iniciar câmera/modelos: " + erro.message;
      }
    });

    document.getElementById("btn-capturar-prof").addEventListener("click", async () => {
      try {
        statusFace.textContent = "Detectando rosto...";
        const descritor = await capturarDescritor(video);
        if (!descritor) {
          statusFace.textContent = "Nenhum rosto detectado. Tente novamente com boa iluminação.";
          return;
        }
        descritorCapturado = descritor;
        atualizarStatusFace();
      } catch (erro) {
        console.error(erro);
        statusFace.textContent = "Erro ao capturar facial: " + erro.message;
      }
    });

    document.getElementById("btn-limpar-face-prof").addEventListener("click", () => {
      descritorCapturado = null;
      descritorExistente = null;
      atualizarStatusFace();
    });

    document.getElementById("form-professor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById("prof-nome").value,
        email: document.getElementById("prof-email").value,
        faceDescriptor: descritorCapturado ?? descritorExistente ?? null,
      };
      try {
        if (profEmEdicao) {
          await atualizarProfessor(profEmEdicao, dados);
          alert("Professor atualizado!");
        } else {
          await criarProfessor(dados);
          alert("Professor cadastrado!");
        }
        limparEdicao();
      } catch (erro) {
        alert(erro.message);
      }
    });

    escutarProfessores((professores) => {
      const container = document.getElementById("lista-professores");
      if (professores.length === 0) {
        container.innerHTML = "<p>Nenhum professor cadastrado ainda.</p>";
        return;
      }
      container.innerHTML = professores
        .map(
          (p) => `
        <div class="lista-item">
          <span>${p.nome} — ${p.email}${temDescritor(p.faceDescriptor) ? " · Facial cadastrada" : ""}</span>
          <button data-id="${p.id}" class="btn-editar">Editar</button>
          <button data-id="${p.id}" class="btn-remover">Remover</button>
        </div>`
        )
        .join("");

      container.querySelectorAll(".btn-editar").forEach((btn) => {
        btn.addEventListener("click", () => {
          const prof = professores.find((p) => p.id === btn.dataset.id);
          if (!prof) return;
          profEmEdicao = prof.id;
          descritorCapturado = null;
          descritorExistente = temDescritor(prof.faceDescriptor) ? prof.faceDescriptor : null;
          document.getElementById("titulo-form").textContent = "Editando professor";
          document.getElementById("prof-nome").value = prof.nome;
          document.getElementById("prof-email").value = prof.email;
          document.getElementById("btn-submit").textContent = "Salvar alterações";
          document.getElementById("btn-cancelar").style.display = "inline-block";
          document.getElementById("prof-nome").focus();
          atualizarStatusFace();
        });
      });

      container.querySelectorAll(".btn-remover").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (confirm("Remover este professor?")) await removerProfessor(btn.dataset.id);
        });
      });
    });

    window.addEventListener("beforeunload", () => pararCamera(video));
  </script>
</body>
</html>
