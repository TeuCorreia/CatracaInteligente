<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Área do Professor</title>

  <link rel="stylesheet" href="css/style.css" />

</head>

<body>

  <header>

    <h1>Área do Professor</h1>

    <nav>
      <a href="index.html">← Voltar</a>
    </nav>

  </header>


  <main>

    <div class="todo">

      Responsável: <strong>Davi</strong>.

      Essa área permite informar a disciplina, o professor,
      selecionar uma sala cadastrada e realizar a alocação da turma.

    </div>


    <div class="card">

      <h2>Alocar turma para hoje</h2>


      <form id="form-turma">


        <!-- DISCIPLINA -->

        <label>Disciplina</label>

        <input
          type="text"
          id="disciplina"
          placeholder="Digite o nome da disciplina"
          required
        />


        <!-- PROFESSOR -->

        <label>Professor</label>

        <input
          type="text"
          id="professorId"
          placeholder="Nome do professor"
          required
        />


        <!-- SALA -->

        <label>Sala</label>

        <select id="salaId" required>

          <option value="">
            Carregando salas...
          </option>

        </select>


        <!-- DATA -->

        <label>Data</label>

        <input
          type="date"
          id="data"
          required
        />


        <!-- HORÁRIO -->

        <label>Horário</label>

        <input
          type="time"
          id="horario"
          required
        />


        <button type="submit">
          Confirmar alocação
        </button>


      </form>

    </div>

  </main>


  <script type="module">

    // ============================================================
    // IMPORTA AS FUNÇÕES
    // ============================================================

    import { criarTurma } from "./js/turmas.js";

    import { escutarSalas } from "./js/salas.js";


    // ============================================================
    // CARREGAR SALAS CADASTRADAS
    // ============================================================

    escutarSalas((salas) => {

      const select = document.getElementById("salaId");


      console.log("SALAS RECEBIDAS:", salas);


      if (salas.length === 0) {

        select.innerHTML =
          "<option value=''>Nenhuma sala cadastrada</option>";

        return;

      }


      select.innerHTML = "";


      salas.forEach((sala) => {

        const option = document.createElement("option");


        // ID da sala no Firebase

        option.value = sala.id;


        // Texto que aparece para o professor

        option.textContent =
          `Sala ${sala.numero} — Módulo ${sala.modulo}, ${sala.andar}º andar`;


        select.appendChild(option);

      });

    });


    // ============================================================
    // SALVAR TURMA
    // ============================================================

    document
      .getElementById("form-turma")
      .addEventListener("submit", async (e) => {

        e.preventDefault();


        try {

          await criarTurma({

            disciplina:
              document.getElementById("disciplina").value,

            professorId:
              document.getElementById("professorId").value,

            salaId:
              document.getElementById("salaId").value,

            data:
              document.getElementById("data").value,

            horario:
              document.getElementById("horario").value

          });


          alert("Turma alocada com sucesso!");


          e.target.reset();


        } catch (erro) {

          console.error(erro);


          alert(
            "Erro ao alocar turma: " +
            erro.message
          );

        }

      });

  </script>

</body>

</html>
