<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área do Professor</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Área do Professor</h1>
    <nav>
      <a href="index.html">← Voltar</a>
    </nav>
  </header>

  <main>
    <div class="todo">
      Responsável: <strong>Davi</strong>.
      Essa área permite informar a disciplina, o professor,
      selecionar uma sala cadastrada e realizar a alocação da turma.
    </div>

    <div class="card">
      <h2>Alocar turma para hoje</h2>
      <form id="form-turma">
        <!-- DISCIPLINA -->
        <label for="disciplina">Disciplina</label>
        <select id="disciplina" required>
          <option value="">Carregando disciplinas...</option>
        </select>

        <!-- PROFESSOR -->
        <label for="professorId">Professor</label>
        <select id="professorId" required>
          <option value="">Carregando professores...</option>
        </select>

        <!-- SALA -->
        <label for="salaId">Sala</label>
        <select id="salaId" required>
          <option value="">Carregando salas...</option>
        </select>

        <!-- DATA -->
        <label for="data">Data</label>
        <input type="date" id="data" required />

        <!-- HORÁRIO -->
        <label for="horario">Horário</label>
        <input type="time" id="horario" required />

        <button type="submit">Confirmar alocação</button>
      </form>
    </div>
  </main>

  <script type="module">
    // ============================================================
    // IMPORTA AS FUNÇÕES
    // ============================================================
    import { criarTurma } from "./js/turmas.js";
    import { escutarSalas } from "./js/salas.js";
    import { escutarProfessores } from "./js/professores.js";
    import { escutarDisciplinas } from "./js/disciplinas.js";

    // Data padrão: hoje
    document.getElementById("data").valueAsDate = new Date();

    // Carregar professores e disciplinas
    escutarProfessores((professores) => {
      const select = document.getElementById("professorId");
      select.innerHTML = professores.length
        ? ""
        : "<option value=''>Nenhum professor cadastrado (rode seed.html)</option>";
      professores.forEach((p) => {
        const option = document.createElement("option");
        option.value = p.id;
        option.textContent = p.nome;
        select.appendChild(option);
      });
    });

    escutarDisciplinas((disciplinas) => {
      const select = document.getElementById("disciplina");
      select.innerHTML = disciplinas.length
        ? ""
        : "<option value=''>Nenhuma disciplina cadastrada (rode seed.html)</option>";
      disciplinas.forEach((d) => {
        const option = document.createElement("option");
        option.value = d.nome;
        option.textContent = d.nome;
        select.appendChild(option);
      });
    });

    // ============================================================
    // CARREGAR SALAS CADASTRADAS
    // ============================================================
    escutarSalas((salas) => {
      const select = document.getElementById("salaId");

      console.log("SALAS RECEBIDAS:", salas);

      if (salas.length === 0) {
        select.innerHTML = "<option value=''>Nenhuma sala cadastrada</option>";
        return;
      }

      select.innerHTML = "";

      salas.forEach((sala) => {
        const option = document.createElement("option");
        option.value = sala.id;
        option.textContent = `Sala ${sala.numero} — Módulo ${sala.modulo}, ${sala.andar}º andar`;
        select.appendChild(option);
      });
    });

    // ============================================================
    // SALVAR TURMA
    // ============================================================
    document.getElementById("form-turma").addEventListener("submit", async (e) => {
      e.preventDefault();

      try {
        await criarTurma({
          disciplina: document.getElementById("disciplina").value,
          professorId: document.getElementById("professorId").value,
          salaId: document.getElementById("salaId").value,
          data: document.getElementById("data").value,
          horario: document.getElementById("horario").value
        });

        alert("Turma alocada com sucesso!");
        e.target.reset();
        document.getElementById("data").valueAsDate = new Date();
      } catch (erro) {
        console.error(erro);
        alert("Erro ao alocar turma: " + erro.message);
      }
    });
  </script>
</body>
</html>
